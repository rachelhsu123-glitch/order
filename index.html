<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辦公室點餐小幫手 (即時連動版)</title>
  <!-- 網頁圖標設定 -->
  <link rel="icon" type="image/png" href="可愛點餐介面貼圖.png">
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --success: #16a34a;
      --success-light: #dcfce7;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 40px; }
    .container { max-width: 960px; margin: 0 auto; padding: 16px; }

    header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 14px 20px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .title-group h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); }
    .title-group p { font-size: 0.85rem; color: var(--text-muted); }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 14px; font-size: 0.85rem; font-weight: 600; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; transition: all 0.15s; background: var(--card-bg); color: var(--text); }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { border-color: var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; }

    .banner-locked { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; padding: 10px 14px; border-radius: var(--radius); font-size: 0.88rem; margin-bottom: 16px; display: none; align-items: center; justify-content: space-between; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-val { font-size: 1.25rem; font-weight: 700; }
    .stat-val.primary { color: var(--primary); }

    .layout-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .layout-grid { grid-template-columns: 1fr; }
    }

    .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

    /* 菜單上傳與預覽 */
    .menu-uploader { border: 2px dashed #cbd5e1; border-radius: var(--radius); padding: 18px; text-align: center; background: #f8fafc; cursor: pointer; margin-bottom: 14px; }
    .menu-uploader:hover { border-color: var(--primary); background: #f1f5f9; }
    .menu-img-container { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); margin-bottom: 14px; display: none; background: #000; }
    .menu-img-container img { width: 100%; max-height: 320px; object-fit: contain; cursor: zoom-in; display: block; }
    .menu-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.8rem; color: var(--text-muted); }

    /* 獨立網址上傳區塊樣式 */
    .input-group { display: flex; gap: 8px; margin-top: 6px; }
    .current-url-display { margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); background: #f8fafc; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); word-break: break-all; }
    .current-url-display a { color: var(--primary); text-decoration: none; }
    .current-url-display a:hover { text-decoration: underline; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; }
    .form-control:focus { outline: none; border-color: var(--primary); }
    .form-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }

    .order-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; }
    .order-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); }
    .order-item .user { font-weight: 600; }
    .order-item .note { font-size: 0.8rem; color: var(--text-muted); }
    .order-item .price { font-weight: 700; margin-left: 8px; }

    .badge-paid { background: var(--success-light); color: var(--success); border: 1px solid #bbf7d0; border-radius: 4px; padding: 2px 6px; font-size: 0.75rem; cursor: pointer; }
    .badge-unpaid { background: var(--danger-light); color: var(--danger); border: 1px solid #fecaca; border-radius: 4px; padding: 2px 6px; font-size: 0.75rem; cursor: pointer; }

    .summary-box { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-top: 14px; }
    .summary-item { display: flex; justify-content: space-between; font-size: 0.88rem; padding: 4px 0; border-bottom: 1px dashed var(--border); }
    .summary-item:last-child { border-bottom: none; }

    /* 燈箱大圖 */
    .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
    .lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-group">
      <h1 id="shopTitle" contenteditable="true" title="點擊可修改店家名稱">今日午餐團購 (即時連動版)</h1>
      <p id="todayDate"></p>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" id="lockBtn" onclick="toggleLock()">🔒 鎖定結單</button>
      <button class="btn btn-outline" onclick="copySummaryText()">📋 複製叫餐清單</button>
      <button class="btn btn-outline" onclick="exportCSV()">📊 匯出 CSV</button>
      <button class="btn btn-danger btn-sm" onclick="clearAllOrders()">清空全部</button>
    </div>
  </header>

  <div id="lockBanner" class="banner-locked">
    <span>⚠️ 主揪已結單，目前停止接收新點單與修改。</span>
    <button class="btn btn-sm btn-outline" onclick="toggleLock()">解除鎖定</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">總點餐份數</div>
      <div class="stat-val" id="totalCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">訂單總金額</div>
      <div class="stat-val primary" id="totalAmount">$0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">點餐人數</div>
      <div class="stat-val" id="totalUsers">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">未收款人數</div>
      <div class="stat-val" style="color: var(--danger);" id="unpaidUsers">0</div>
    </div>
  </div>

  <div class="layout-grid">
    <!-- 左側：菜單上傳、網址上傳與點餐 -->
    <div>
      <!-- 獨立網址上傳欄位 (即時同步) -->
      <div class="card">
        <div class="card-title">🔗 共用網址設定</div>
        <div class="form-group" style="margin-bottom: 0;">
          <label for="urlInput">輸入菜單/活動網址：</label>
          <div class="input-group">
            <input type="url" id="urlInput" class="form-control" placeholder="https://example.com">
            <button type="button" class="btn btn-primary" onclick="submitSharedUrl()">更新</button>
          </div>
          <div class="current-url-display">
            <strong>目前共用網址：</strong>
            <div id="displayUrl" style="margin-top: 2px; color: var(--text-muted);">載入中...</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>📖 店家菜單圖片</span>
          <button class="btn btn-sm btn-outline" id="removeImgBtn" style="display:none;" onclick="removeMenuImage()">移除圖片</button>
        </div>
        
        <div id="uploadBox" class="menu-uploader" onclick="document.getElementById('menuInput').click()">
          <p>📷 點擊上傳菜單圖片</p>
          <span style="font-size: 0.75rem; color: var(--text-muted);">支援 JPG、PNG</span>
          <input type="file" id="menuInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        </div>

        <div id="previewBox" class="menu-img-container">
          <img id="menuImg" alt="菜單預覽" onclick="openLightbox()">
          <div class="menu-actions">
            <span>🔍 點擊圖片放大檢視</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📝 我要點餐</div>
        <form id="orderForm" onsubmit="addOrder(event)">
          <div class="form-group">
            <label>同事暱稱</label>
            <input type="text" id="userName" class="form-control" placeholder="請輸入姓名/暱稱" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>餐點品項</label>
              <input type="text" id="itemName" class="form-control" placeholder="例如：排骨便當" required>
            </div>
            <div class="form-group">
              <label>金額 ($)</label>
              <input type="number" id="price" class="form-control" placeholder="100" min="0" required>
            </div>
          </div>
          <div class="form-group">
            <label>備註需求</label>
            <input type="text" id="options" class="form-control" placeholder="例如：微辣、飯少、不加香菜">
          </div>
          <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">+ 送出訂單</button>
        </form>
      </div>
    </div>

    <!-- 右側：訂單清單與統計 -->
    <div>
      <div class="card">
        <div class="card-title">
          <span>📋 即時點餐清單 (多人同步)</span>
        </div>
        <ul id="orderList" class="order-list"></ul>
      </div>

      <div class="card">
        <div class="card-title">📞 主揪叫餐彙總 (打電話用)</div>
        <div id="summaryList" class="summary-box">
          <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">尚無訂單彙總</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

<script>
  // ===== Supabase 連線設定 =====
  const SUPABASE_URL = 'https://empupkopcyczxlevmudm.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_1-LJ4UZT9wdfZW-9_P8csw_gGEXvhI8';

  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let orders = [];
  let isLocked = JSON.parse(localStorage.getItem('office_locked') || 'false');
  let savedMenuImg = localStorage.getItem('office_menu_img') || '';

  // 初始化日期
  const optionsDate = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
  document.getElementById('todayDate').innerText = new Date().toLocaleDateString('zh-TW', optionsDate);

  if (savedMenuImg) {
    showMenuImage(savedMenuImg);
  }

  // 初始化載入資料與即時監聽
  fetchOrders();
  fetchSharedUrl();
  setupRealtimeSubscription();

  // ===== 訂單相關邏輯 =====
  async function fetchOrders() {
    const { data, error } = await _supabase.from('orders').select('*').order('created_at', { ascending: true });
    if (!error) {
      orders = data || [];
      updateUI();
    }
  }

  function setupRealtimeSubscription() {
    _supabase
      .channel('public:all_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
        fetchOrders();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_settings' }, payload => {
        if (payload.new && payload.new.key === 'shared_url') {
          updateSharedUrlDisplay(payload.new.value);
        }
      })
      .subscribe();
  }

  function updateUI() {
    renderOrders();
    renderSummary();
    updateStats();
    updateLockState();
    localStorage.setItem('office_locked', JSON.stringify(isLocked));
  }

  async function addOrder(e) {
    e.preventDefault();
    if (isLocked) {
      alert('主揪已結單，無法再新增或修改訂單！');
      return;
    }

    const userName = document.getElementById('userName').value.trim();
    const itemName = document.getElementById('itemName').value.trim();
    const price = parseInt(document.getElementById('price').value) || 0;
    const options = document.getElementById('options').value.trim();

    const newOrder = {
      id: Date.now(),
      user_name: userName,
      item_name: itemName,
      price: price,
      options: options,
      is_paid: false
    };

    const { error } = await _supabase.from('orders').insert([newOrder]);
    if (error) {
      alert('送出訂單失敗: ' + error.message);
    } else {
      document.getElementById('orderForm').reset();
    }
  }

  async function deleteOrder(id) {
    if (isLocked) {
      alert('主揪已結單，無法刪除訂單！');
      return;
    }
    await _supabase.from('orders').delete().eq('id', id);
  }

  async function togglePaid(id, currentStatus) {
    await _supabase.from('orders').update({ is_paid: !currentStatus }).eq('id', id);
  }

  function renderOrders() {
    const listEl = document.getElementById('orderList');
    if (orders.length === 0) {
      listEl.innerHTML = `<li style="text-align: center; color: var(--text-muted); padding: 20px; font-size: 0.85rem;">目前還沒有人點餐喔！</li>`;
      return;
    }

    listEl.innerHTML = orders.map(o => `
      <li class="order-item">
        <div>
          <div><span class="user">${o.user_name}</span> <span class="price">$${o.price}</span></div>
          <div class="note">${o.item_name} ${o.options ? ' (' + o.options + ')' : ''}</div>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <span class="${o.is_paid ? 'badge-paid' : 'badge-unpaid'}" onclick="togglePaid(${o.id}, ${o.is_paid})" title="點擊切換付款狀態">
            ${o.is_paid ? '已付款' : '未付款'}
          </span>
          ${!isLocked ? `<button class="btn btn-sm btn-outline" style="color: var(--danger); border-color: #fecaca;" onclick="deleteOrder(${o.id})">刪</button>` : ''}
        </div>
      </li>
    `).join('');
  }

  function renderSummary() {
    const summaryEl = document.getElementById('summaryList');
    if (orders.length === 0) {
      summaryEl.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">尚無訂單彙總</div>`;
      return;
    }

    const summaryMap = {};
    orders.forEach(o => {
      const key = `${o.item_name}_${o.options || '無'}`;
      if (!summaryMap[key]) {
        summaryMap[key] = { itemName: o.item_name, options: o.options, count: 0, totalPrice: 0 };
      }
      summaryMap[key].count += 1;
      summaryMap[key].totalPrice += o.price;
    });

    summaryEl.innerHTML = Object.values(summaryMap).map(s => `
      <div class="summary-item">
        <div><strong>${s.itemName}</strong> ${s.options ? `<span style="color: var(--text-muted); font-size: 0.8rem;">(${s.options})</span>` : ''}</div>
        <div><strong>x ${s.count}</strong> 份 ($${s.totalPrice})</div>
      </div>
    `).join('');
  }

  function updateStats() {
    const totalCount = orders.length;
    const totalAmount = orders.reduce((sum, o) => sum + o.price, 0);
    const uniqueUsers = new Set(orders.map(o => o.user_name)).size;
    const unpaidCount = orders.filter(o => !o.is_paid).length;

    document.getElementById('totalCount').innerText = totalCount;
    document.getElementById('totalAmount').innerText = `$${totalAmount}`;
    document.getElementById('totalUsers').innerText = uniqueUsers;
    document.getElementById('unpaidUsers').innerText = unpaidCount;
  }

  function toggleLock() {
    isLocked = !isLocked;
    updateUI();
  }

  function updateLockState() {
    const lockBtn = document.getElementById('lockBtn');
    const lockBanner = document.getElementById('lockBanner');
    const submitBtn = document.getElementById('submitBtn');

    if (isLocked) {
      lockBtn.innerText = '🔓 解除鎖定';
      lockBanner.style.display = 'flex';
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.6';
      submitBtn.innerText = '已結單 (停止收單)';
    } else {
      lockBtn.innerText = '🔒 鎖定結單';
      lockBanner.style.display = 'none';
      submitBtn.disabled = false;
      submitBtn.style.opacity = '1';
      submitBtn.innerText = '+ 送出訂單';
    }
    renderOrders();
  }

  async function clearAllOrders() {
    if (confirm('確定要清空所有訂單嗎？')) {
      for (let o of orders) {
        await _supabase.from('orders').delete().eq('id', o.id);
      }
    }
  }

  // ===== 共用網址功能邏輯 (即時同步) =====
  async function fetchSharedUrl() {
    const { data, error } = await _supabase
      .from('app_settings')
      .select('value')
      .eq('key', 'shared_url')
      .single();

    if (!error && data) {
      updateSharedUrlDisplay(data.value);
    } else {
      document.getElementById('displayUrl').textContent = '尚未設定網址';
    }
  }

  function updateSharedUrlDisplay(url) {
    const displayEl = document.getElementById('displayUrl');
    if (!url) {
      displayEl.innerHTML = '<span style="color: #94a3b8;">目前尚未設定網址</span>';
    } else {
      displayEl.innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
    }
  }

  async function submitSharedUrl() {
    const urlInput = document.getElementById('urlInput');
    const urlValue = urlInput.value.trim();

    if (!urlValue) {
      alert('請先輸入網址！');
      return;
    }

    try {
      new URL(urlValue);
    } catch (_) {
      alert('請輸入有效的網址格式（需包含 http:// 或 https://）');
      return;
    }

    const { error } = await _supabase
      .from('app_settings')
      .update({ value: urlValue })
      .eq('key', 'shared_url');

    if (error) {
      alert('更新共用網址失敗: ' + error.message);
    } else {
      alert('共用網址已更新，所有在線上的同事將同步看到！');
      urlInput.value = '';
    }
  }

  // ===== 菜單圖片與其他工具 =====
  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        savedMenuImg = event.target.result;
        localStorage.setItem('office_menu_img', savedMenuImg);
        showMenuImage(savedMenuImg);
      };
      reader.readAsDataURL(file);
    }
  }

  function showMenuImage(src) {
    document.getElementById('menuImg').src = src;
    document.getElementById('uploadBox').style.display = 'none';
    document.getElementById('previewBox').style.display = 'block';
    document.getElementById('removeImgBtn').style.display = 'inline-flex';
  }

  function removeMenuImage() {
    savedMenuImg = '';
    localStorage.removeItem('office_menu_img');
    document.getElementById('previewBox').style.display = 'none';
    document.getElementById('uploadBox').style.display = 'block';
    document.getElementById('removeImgBtn').style.display = 'none';
    document.getElementById('menuInput').value = '';
  }

  function openLightbox() {
    const lightbox = document.getElementById('lightbox');
    lightbox.style.display = 'flex';
    document.getElementById('lightboxImg').src = document.getElementById('menuImg').src;
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
  }

  function copySummaryText() {
    if (orders.length === 0) {
      alert('目前沒有訂單可以複製！');
      return;
    }
    const shopName = document.getElementById('shopTitle').innerText;
    let text = `【${shopName} 叫餐清單】\n`;
    
    orders.forEach((o, index) => {
      text += `${index + 1}. ${o.user_name}: ${o.item_name} ${o.options ? '(' + o.options + ')' : ''} - $${o.price}\n`;
    });
    
    const totalAmount = orders.reduce((sum, o) => sum + o.price, 0);
    text += `\n總計: ${orders.length} 份，共 $${totalAmount} 元`;

    navigator.clipboard.writeText(text).then(() => {
      alert('已成功複製叫餐清單到剪貼簿！');
    });
  }

  function exportCSV() {
    if (orders.length === 0) {
      alert('目前沒有資料可以匯出！');
      return;
    }
    let csv = '\uFEFF姓名,品項,金額,備註,付款狀態\n';
    orders.forEach(o => {
      csv += `"${o.user_name}","${o.item_name}",${o.price},"${o.options || ''}","${o.is_paid ? '已付款' : '未付款'}"\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `午餐團購清單_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
